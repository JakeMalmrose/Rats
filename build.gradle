plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = 'com.github.alexthe666.rats'

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// JEI and Jade do not exist for 26.1 yet — exclude their plugins from compilation until they do.
sourceSets.main.java.exclude 'com/github/alexthe666/rats/compat/jei/**'
sourceSets.main.java.exclude 'com/github/alexthe666/rats/compat/jade/**'
// Datagen providers target the old 1.21.1 datagen API; the shipped JSON under src/generated/resources
// is the source of truth (it was extracted from the released jar), so skip compiling them.
// The data/**/tags classes stay: they hold TagKey constants referenced by live code (stripped to
// constants-only for 26.1).
sourceSets.main.java.exclude 'com/github/alexthe666/rats/data/*.java'
sourceSets.main.java.exclude 'com/github/alexthe666/rats/data/loot/**'
sourceSets.main.java.exclude 'com/github/alexthe666/rats/data/ratlantis/*.java'
sourceSets.main.java.exclude 'com/github/alexthe666/rats/data/ratlantis/loot/**'

neoForge {
    version = project.neo_version

    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
}

dependencies {
    implementation "com.github.alexthe666:citadelneoforge:${project.citadel_version}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'AlexThe666',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'AlexThe666'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
